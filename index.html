<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniGPT</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#e9edf7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit;background:#1b2232;border:1px solid #343f56;border-radius:9px;padding:10px}button{cursor:pointer}button:hover{border-color:#7da8ff}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{padding:24px 16px;background:#141a26;border-right:1px solid #293247}h1{font-size:24px;margin:0 0 6px}.sub{color:#a6b3cc;font-size:13px}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.list button{display:block;width:100%;text-align:left;margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .active{border-color:#7da8ff}main{max-width:1050px;width:100%;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:24px}#messages{min-height:45vh}.message{margin:16px 0;padding:18px;background:#171e2b;border:1px solid #28334a;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 system-ui}.message.user{background:#202e47}.role{font-size:12px;color:#a9bfe5;margin-bottom:8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}textarea{width:100%;resize:vertical;min-height:110px;margin:12px 0}.primary{background:#3b69c5;border-color:#3b69c5}label{display:block;margin:12px 0}label input:not([type=checkbox]),label select{display:block;width:100%;margin-top:8px}.panel{max-width:700px}a{color:#9bbcff}#status{min-height:26px;color:#b1c9ef;margin:12px 0}pre{white-space:pre-wrap}.hidden{display:none!important}footer{color:#a4afc4;font-size:12px;margin-top:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;padding:16px}.list{max-height:130px;overflow:auto}nav{margin:12px 0}main{padding:18px}}
</style></head><body><div class="layout"><aside><h1>MiniGPT</h1><div class="sub">個人 AI 工作台 · 雲端版</div><nav><button data-tab="chat">聊天</button><button data-tab="math">數學</button><button data-tab="settings">設定</button></nav><button id="new">＋ 新對話</button><div id="list" class="list"></div><footer>對話保存在此瀏覽器。<br>匯出備份可移至其他裝置。</footer></aside>
<main><header><div><strong id="title">新對話</strong><div class="sub" id="model">請到設定輸入存取密碼</div></div><div class="row"><button id="export">匯出</button><button id="import">匯入</button><button id="delete">刪除</button></div></header>
<section id="chat"><div class="row"><select id="mode" aria-label="助理模式"><option>一般</option><option>學習</option><option>程式</option><option>數學</option><option>研究</option><option>創作</option></select><label><input id="search" type="checkbox"> 網路搜尋</label><button id="again">重新生成</button></div><div id="messages"></div><form id="form"><textarea id="prompt" maxlength="12000" placeholder="輸入訊息；Enter 送出，Shift + Enter 換行" aria-label="訊息"></textarea><div class="row"><button id="send" class="primary">送出</button><button id="stop" type="button" disabled>停止</button><input id="attach" type="file" accept=".txt,.md,.py,.js,.ts,.html,.css,.cpp,.c,.json,.csv,.se"><span class="sub">附加文字檔，最多 10,000 字元</span></div></form></section>
<section id="math" class="panel hidden"><h2>數學工具</h2><p class="sub">由 SymPy 計算；例如 x^2-4=0。矩陣與統計使用 JSON 陣列。</p><label>算式<input id="expr" value="x^2-4=0" maxlength="500"></label><div class="row"><select id="operation"><option value="solve">解方程式</option><option value="calculate">計算</option><option value="simplify">化簡</option><option value="factor">因式分解</option><option value="diff">微分</option><option value="integrate">積分</option><option value="limit">極限</option><option value="matrix_det">行列式</option><option value="matrix_inverse">反矩陣</option><option value="statistics">平均與母體變異數</option></select><select id="variable"><option>x</option><option>y</option><option>z</option><option>t</option></select><input id="point" value="0" placeholder="極限位置" maxlength="50"></div><button id="calculate" class="primary">計算</button><pre id="mathresult"></pre></section>
<section id="settings" class="panel hidden"><h2>設定</h2><label>網站存取密碼<input id="token" type="password" autocomplete="off" placeholder="MINIGPT_ACCESS_TOKEN"></label><p class="sub">只在此分頁的工作階段保存。模型 API 金鑰請設在 Vercel 環境變數。</p><label>個人記憶<textarea id="memory" maxlength="3000" placeholder="例如：使用繁體中文，教學使用 C++ 範例。"></textarea></label><button id="save" class="primary">保存並測試連線</button><button id="logout">清除存取密碼</button><p>聊天使用雲端模型 API。LoRA、模型訓練、OCR、本機圖片與語音模型請使用原本的本機版本。</p></section>
<div id="status" role="status"></div></main></div><input id="importfile" class="hidden" type="file" accept=".json">
<script>
const $=id=>document.getElementById(id);
const KEY='minigpt-vercel-v1';let state={conversations:[],memory:''},cid='',controller=null,busy=false;
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.conversations))state=raw;}catch{}
function notice(s){$('status').textContent=s;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{notice('瀏覽器儲存空間不足，請先匯出備份。');}}
function current(){return state.conversations.find(c=>c.id===cid);}
function create(){if(busy)return;const c={id:crypto.randomUUID(),title:'新對話',messages:[]};state.conversations.unshift(c);cid=c.id;persist();render();}
function show(tab){for(const t of ['chat','math','settings'])$(t).classList.toggle('hidden',t!==tab);}
function render(){const c=current();$('title').textContent=c?.title||'新對話';$('list').replaceChildren();for(const conv of state.conversations){const b=document.createElement('button');b.textContent=conv.title;b.className=conv.id===cid?'active':'';b.disabled=busy;b.onclick=()=>{cid=conv.id;render();};$('list').append(b);} $('messages').replaceChildren();for(const m of c?.messages||[]){const box=document.createElement('div');box.className='message '+m.role;const r=document.createElement('div');r.className='role';r.textContent=m.role==='user'?'你':'MiniGPT';const txt=document.createElement('div');txt.textContent=m.content;box.append(r,txt);for(const source of m.sources||[]){const a=document.createElement('a');try{const u=new URL(source.url);if(!['https:','http:'].includes(u.protocol))continue;a.href=u.href;}catch{continue;}a.textContent='\n'+source.title;a.target='_blank';a.rel='noopener noreferrer';box.append(a);}$('messages').append(box);}for(const id of ['new','delete','import','again','send','attach'])$(id).disabled=busy;$('stop').disabled=!busy;}
async function api(url,options={}){const res=await fetch(url,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(sessionStorage.getItem('minigpt-token')||''),...options.headers}});if(!res.ok){let msg='HTTP '+res.status;try{const d=await res.json();msg=typeof d.detail==='string'?d.detail:JSON.stringify(d.detail);}catch{}throw Error(msg);}return res;}
async function configuration(){try{const d=await(await api('/api/settings')).json();$('model').textContent=d.model+(d.configured?' · 已連線設定':' · 缺少 API 金鑰');$('search').disabled=!d.search_enabled;if(!d.search_enabled)$('search').checked=false;notice(d.configured?'設定已保存，可開始聊天。':'請在 Vercel 設定 OPENAI_API_KEY。');}catch(e){notice(e.message);}}
function context(messages){const out=[];let size=0;for(const m of [...messages].reverse()){if(out.length>=40||size+m.content.length>24000)break;if(!m.content)continue;out.unshift({role:m.role,content:m.content});size+=m.content.length;}return out;}
async function generate(){const c=current();const messages=context(c.messages);const answer={role:'assistant',content:''};c.messages.push(answer);busy=true;controller=new AbortController();render();notice('正在生成…');let done=false;
try{const res=await api('/api/chat',{method:'POST',signal:controller.signal,body:JSON.stringify({messages,mode:$('mode').value,memory:state.memory,search:$('search').checked})});const reader=res.body.getReader();const decoder=new TextDecoder();let buffer='';while(true){const chunk=await reader.read();buffer+=decoder.decode(chunk.value||new Uint8Array(),{stream:!chunk.done});let index;while((index=buffer.indexOf('\n\n'))>=0){const event=buffer.slice(0,index);buffer=buffer.slice(index+2);for(const line of event.split('\n')){if(!line.startsWith('data:'))continue;const data=JSON.parse(line.slice(5));if(data.error)throw Error(data.error);if(data.delta){answer.content+=data.delta;render();}if(data.sources)answer.sources=data.sources;if(data.done)done=true;}}if(chunk.done)break;}if(!done)throw Error('連線提早結束，已保留收到的內容。');notice('完成。');}catch(e){notice(e.name==='AbortError'?'已停止，保留收到的內容。':e.message);}finally{if(!answer.content)c.messages.pop();busy=false;controller=null;persist();render();}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('prompt').value.trim();if(!text)return;if(!current())create();const c=current();c.messages.push({role:'user',content:text});if(c.title==='新對話')c.title=text.slice(0,30);$('prompt').value='';persist();await generate();};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}};
$('stop').onclick=()=>controller?.abort();$('new').onclick=create;
$('again').onclick=async()=>{if(busy)return;const c=current();if(!c?.messages.length)return;if(c.messages.at(-1).role==='assistant')c.messages.pop();if(c.messages.at(-1)?.role==='user')await generate();};
$('delete').onclick=()=>{if(busy||!current()||!confirm('刪除此對話？'))return;state.conversations=state.conversations.filter(c=>c.id!==cid);cid=state.conversations[0]?.id||'';if(!cid)create();persist();render();};
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>show(b.dataset.tab);
$('token').value=sessionStorage.getItem('minigpt-token')||'';$('memory').value=state.memory||'';
$('save').onclick=()=>{sessionStorage.setItem('minigpt-token',$('token').value.trim());state.memory=$('memory').value;persist();configuration();};
$('logout').onclick=()=>{sessionStorage.removeItem('minigpt-token');$('token').value='';notice('已清除存取密碼。');};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MiniGPT-conversations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('匯入檔案上限 2 MB');const d=JSON.parse(await file.text());let cs=d.conversations;if(!cs&&Array.isArray(d.messages))cs=[{title:d.title||'匯入對話',messages:d.messages}];if(!Array.isArray(cs)||cs.length>100)throw Error('請選擇 MiniGPT 匯出的 JSON');const imported=cs.map(c=>{if(!Array.isArray(c.messages)||c.messages.length>1000)throw Error('訊息格式錯誤');return {id:crypto.randomUUID(),title:String(c.title||'匯入對話').slice(0,60),messages:c.messages.map(m=>{if(!['user','assistant'].includes(m.role)||typeof m.content!=='string'||m.content.length>100000)throw Error('訊息格式錯誤');return {role:m.role,content:m.content};})};});state.conversations.unshift(...imported);cid=imported[0]?.id||cid;persist();render();notice('已匯入。');}catch(err){notice(err.message);}finally{e.target.value='';}};
$('attach').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>40000)throw Error('文字檔太大');const text=await f.text();const combined=$('prompt').value+'\n\n檔案 '+f.name+'：\n'+text;if(text.length>10000||combined.length>12000)throw Error('檔案與訊息合計超過字元上限');$('prompt').value=combined;notice('文字檔已附加，請輸入需求後送出。');}catch(err){notice(err.message);}finally{e.target.value='';}};
$('calculate').onclick=async()=>{$('calculate').disabled=true;try{const d=await(await api('/api/math',{method:'POST',body:JSON.stringify({expression:$('expr').value,operation:$('operation').value,variable:$('variable').value,point:$('point').value})})).json();$('mathresult').textContent='精確：'+d.exact+'\n近似：'+d.approx+(d.verification?'\n驗算：'+JSON.stringify(d.verification,null,2):'');notice('計算完成。');}catch(e){notice(e.message);}finally{$('calculate').disabled=false;}};
cid=state.conversations[0]?.id||'';if(!cid)create();else render();if(sessionStorage.getItem('minigpt-token'))configuration();
</script></body></html>
